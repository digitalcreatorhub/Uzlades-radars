name: Worker health

# Раз в неделю проверяет, что Worker «uzlades-push» жив и что его ключ для пушей совпадает с тем,
# что получается из секрета CLOUDFLARE_API_TOKEN (если токен сменили, а Worker не перевыложили, пуши перестанут доходить).
# При сбое запуск становится красным, и GitHub присылает письмо.
on:
  schedule:
    - cron: '23 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  health:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          API=$(node -e "process.stdout.write(JSON.parse(require('fs').readFileSync('push-config.json','utf8')).api || '')")
          if [ -z "$API" ]; then echo "В push-config.json нет адреса Worker: пуши выключены, проверять нечего"; exit 0; fi
          curl -fsS --retry 3 --retry-delay 10 --max-time 20 "$API/health" -o health.json || { echo "::error::Worker не отвечает на /health ($API)"; exit 1; }
          node -e "const h=JSON.parse(require('fs').readFileSync('health.json','utf8')); if(!(h.ok===true && h.vapid===true)){console.error('Ответ /health неожиданный:', JSON.stringify(h)); process.exit(1)}" || { echo "::error::Worker отвечает, но не готов (нет ключа пушей). Запустите Deploy push worker заново."; exit 1; }
          curl -fsS --retry 3 --retry-delay 10 --max-time 20 "$API/vapid" -o vapid.json || { echo "::error::Worker не отдаёт ключ пушей"; exit 1; }
          if [ -n "$CLOUDFLARE_API_TOKEN" ]; then
            WANT=$(node scripts/push_keys.mjs public)
            GOT=$(node -e "process.stdout.write(JSON.parse(require('fs').readFileSync('vapid.json','utf8')).key||'')")
            if [ "$WANT" != "$GOT" ]; then
              echo "::error::Ключ пушей в Worker не совпадает с ключом из секрета CLOUDFLARE_API_TOKEN. Запустите Deploy push worker заново."
              exit 1
            fi
          fi
          echo "Worker в порядке: $API"
